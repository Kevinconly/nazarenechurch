project_id = "nazarene-church-archive"

[api]
enabled = true
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.media-quarantine]
public = false
file_size_limit = "50MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

[storage.buckets.media-processed]
public = false
file_size_limit = "25MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

[functions.archive]
verify_jwt = false

[functions.bootstrap-super-admin]
verify_jwt = false

[functions.admin-users]
verify_jwt = false

